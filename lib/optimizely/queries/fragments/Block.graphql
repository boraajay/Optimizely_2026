fragment HeroBlockFragment on HeroBlock {
  title
  description
  subtitle
  decorationColorsPrimary
  decorationColorsSecondary
  showDecoration
  exploreAllPackagesDealsCTA {
    text
    title
  }
  viewLiveChannelGuideCTA {
    text
    title
  }
}

fragment ContactBlockFragment on ContactBlock {
  title
  description
}

fragment LogosBlockFragment on LogosBlock {
  logos {
    __typename
    ... on LogoItemBlock {
      src
      alt
    }
  }
}

fragment PortfolioGridBlockFragment on PortfolioGridBlock {
  title
  description
  items {
    __typename
    ... on PortfolioItemBlock {
      channelsCount
      description
      imageUrl
      link
      monthlyPrices
      pricePeriod
      title
      isPopular
      badge
      channelsIncludedList {
        ... on portfolioChannelsIncluded {
          channels
        }
      }
    }
  }
}

fragment ServicesBlockFragment on ServicesBlock {
  Title
  Description
  CtaButtonText
  CtaUrl {
    text
    title
  }
  services {
    __typename
    ... on ServiceItem {
      title
      description
      icon
      BadgeClass
      packageHighlights
      ctaText {
        text
        title
      }
    }
  }
}

fragment TestimonialsBlockFragment on TestimonialsBlock {
  title
  testimonials {
    __typename
    ... on TestimonialItemBlock {
      fullName
      position
      content
      avatarSrc
    }
  }
}

fragment ProfileBlockFragment on ProfileBlock {
  imageSrc
  bio
  name
  title
}

fragment AvailabilityBlockFragment on AvailabilityBlock {
  availability
  projectTypes
}

fragment StoryBlockFragment on StoryBlock {
  story
  highlights
}

fragment StatusBlockFragment on StatusBlock {
  __typename
  statusItems {
    ... on StatusBlockItems {
      accent
      label
      value
    }
  }
}

fragment ImageBannerFragment on ImageBanner {
  Title
  Description
  CTA {
    title
    text
    url {
      default
      base
    }
  }
  BannerImage {
    key
    url {
      default
    }
  }
}
fragment MiniPacksAvailableFragment on MiniPacksAvailable {
  _fulltext
  Title
  MiniPacksavailableItems {
    ... on MiniPacksavailableItem {
      _deleted
      _modified
      Title
      Badge
      Description
      SpecialPriceText
      SpecialPrice
      ShortDescription
      PricePeriod
      Price
      PackagesImage {
        key
        url {
          default
        }
      }
    }
  }
}

fragment AYearOfNetflixBannerFragment on AYearOfNetflixBanner {
  _deleted
  _modified
  Title
  Description
  BannerImage {
    key
    url {
      default
    }
  }
  ExplorePlanCTA {
    title
    url {
      default
    }
  }
  TryTheExperienceCTA {
    title
    url {
      default
    }
  }
  TermsDescription
  TermsCTA {
    title
    url {
      default
    }
  }
}
fragment ProofOfGenrePackFragment on ProofOfGenrePack {
  Title
  ProofOfGenrePackItems {
    ... on ProofOfGenrePackItem {
      Comment
      CommentDescription
      CommenterName
    }
  }
  ShopGenreCTA {
    title
    url {
      default
    }
  }
}

fragment ItemsInContentArea on _IContent {
  __typename
  ...HeroBlockFragment
  ...ContactBlockFragment
  ...StatusBlockFragment
  ...LogosBlockFragment
  ...PortfolioGridBlockFragment
  ...ServicesBlockFragment
  ...TestimonialsBlockFragment
  ...ProfileBlockFragment
  ...AvailabilityBlockFragment
  ...StoryBlockFragment
  ...ImageBannerFragment
  ...MiniPacksAvailableFragment
  ...AYearOfNetflixBannerFragment
  ...ProofOfGenrePackFragment
}
